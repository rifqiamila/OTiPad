<label class="box pink" id="box-text">
  <span class="box-label">Input Text</span>
  <textarea id="input-text"></textarea>
</label>

<div class="box pink" id="box-file" hidden>
  <span class="box-label">Input File</span>
  <label class="dropzone" id="dropzone">
    <input type="file" id="input-file" accept=".txt">
    <span id="file-name">Drop file .txt di sini atau klik untuk memilih</span>
  </label>
</div>
