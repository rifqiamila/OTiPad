<section id="result" class="result" hidden>
  <h2 id="result-title">Ciphertext Result:</h2>
  <div class="bubble bubble-1">
    <textarea id="result-text" readonly></textarea>
    <div class="side-btns">
      <button type="button" class="btn" id="btn-dl-result">Download</button>
      <button type="button" class="btn" id="btn-share">Share</button>
      <button type="button" class="btn" id="btn-copy-result" hidden>Copy</button>
    </div>
  </div>
  <p class="hint" id="hint">Copy ciphertext or download it by clicking the 'download' button.</p>
  <img class="maskot maskot-result" src="{{ url_for('static', filename='img/maskot.png') }}" alt="">

  <div id="key-result" hidden>
    <h2>Auto-Generate Key</h2>
    <div class="bubble bubble-2">
      <textarea id="key-out" readonly></textarea>
    </div>
    <div class="key-btns">
      <button type="button" class="btn" id="btn-dl-key">Download</button>
      <button type="button" class="btn" id="btn-copy-key">Copy</button>
    </div>
  </div>
</section>
